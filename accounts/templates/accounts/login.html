{% extends "base.html" %}

{% block title %}
Login - Job Tracker
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="text-center fw-bold mb-4">
                    Welcome Back
                </h2>

                <p class="text-center text-muted mb-4">
                    Login to manage your job applications.
                </p>


                {% if error %}

                    <div class="alert alert-danger">
                        {{ error }}
                    </div>

                {% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Login
                    </button>

                </form>


                <p class="text-center mt-4 mb-0">

                    Don't have an account?

                    <a href="{% url 'register' %}">
                        Create one
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
